name: quality

# 只读验证：本仓库**没有任何写回入口**（D07.1 选定的模型是「PR 内提交生成索引」）。
#
# 演进：D05 把写回拆到 registry.yml；D07 用 needs 把写回绑定到同 SHA 门禁，却因此
# 形成循环——门禁里的 `--check` 要求索引已与源一致，于是「需要重建」的输入永远
# 到不了写回 job，写回只在无事可做时运行。D07.1 去掉整个自动写回：源文件与索引
# 由贡献者在同一个 PR 里提交，CI 只校验结果是否与源一致（stale → 明确失败 +
# 可执行 hint）。这样模型无环、与 RS01 的主分支保护天然兼容，也不需要 bot 直推。
#
# Action 全部固定到 commit SHA（注释标版本），与宿主 T21 使用同一组解析结果。
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: quality (node 26.8.2 / macos)
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 12.4.2
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - name: Install (frozen)
        run: pnpm install --frozen-lockfile
      - name: Command index is consistent
        run: node scripts/build-registry.mjs --check
      - name: Rule index is consistent
        run: node scripts/build-rules.mjs --check
      - name: Tests
        run: pnpm test

  compatibility:
    name: quality (node 24.15.0 / macos)
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 12.4.2
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.15.0
          cache: pnpm
      - name: Install (frozen)
        run: pnpm install --frozen-lockfile
      - name: Index checks
        run: |
          node scripts/build-registry.mjs --check
          node scripts/build-rules.mjs --check
      - name: Tests
        run: pnpm test
