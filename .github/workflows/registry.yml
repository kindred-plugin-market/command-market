name: Registry

# push main → 重算 registry.json（命令文件 sha256/size）与 rules.json（登录规则 sha256/size）；
# 若有漂移自动 commit 回 main（保证索引与源文件永远一致）。
on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Rebuild registry and rules index
        run: |
          node scripts/build-registry.mjs
          node scripts/build-rules.mjs

      - name: Commit updated indexes
        run: |
          if [[ -n "$(git status --porcelain registry.json rules.json)" ]]; then
            git config user.name "bench-market-bot"
            git config user.email "bench-market-bot@users.noreply.github.com"
            git add registry.json rules.json
            git commit -m "chore: rebuild indexes [skip ci]"
            git push
          else
            echo "indexes up to date"
          fi
