name: Registry

# push main → 只读门禁（索引一致性 + 全量测试）通过后，重算 registry.json
# （命令文件 sha256/size）与 rules.json（登录规则 sha256/size）；有漂移才 commit 回 main。
#
# D05/D07 写回职责分离：本工作流是**唯一**的写回入口，且 `contents: write` 只给
# rebuild job。写回必须建立在**同一条 run、同一个 SHA** 通过验证的源之上——此前
# quality.yml 与 registry.yml 各自监听 push、彼此无依赖，同 SHA 出现过 quality 红
# 而 Registry 绿（run 34915374475 / 34915374485）、坏输入照样写入索引的实证。
on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  # 写回不可被取消：并发组独立于 quality，且不允许 cancel-in-progress，
  # 避免写回中途被新 push 掐断。
  group: registry-writeback
  cancel-in-progress: false

jobs:
  verify:
    name: quality gate (read-only)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 12.4.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install (frozen)
        run: pnpm install --frozen-lockfile

      - name: Index checks
        run: |
          node scripts/build-registry.mjs --check
          node scripts/build-rules.mjs --check

      - name: Tests
        run: pnpm test

  rebuild:
    # 写权限 job 的唯一起点是门禁成功：needs + if 双重表达，缺一不可
    # （tests/workflow.test.mjs 用负向 fixture 锁定这条语义）。
    needs: verify
    if: needs.verify.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # 绑定被门禁验证过的那个 SHA，不跟随会移动的 main。
          ref: ${{ github.sha }}

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 12.4.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install (frozen)
        run: pnpm install --frozen-lockfile

      - name: Rebuild registry and rules index
        run: |
          node scripts/build-registry.mjs
          node scripts/build-rules.mjs

      - name: Commit updated indexes
        env:
          VALIDATED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          # 乐观并发检查：写回前确认 main 仍停在被验证的 SHA。并发 push 时旧 run
          # 直接失败退出（不做无界重试），由新 SHA 的那一次 run 负责写回。
          git fetch --no-tags --depth=1 origin main
          tip="$(git rev-parse origin/main)"
          if [ "$tip" != "$VALIDATED_SHA" ]; then
            echo "::error::origin/main is $tip but this run verified $VALIDATED_SHA; refusing to write indexes from a stale base."
            exit 1
          fi
          if [[ -n "$(git status --porcelain registry.json rules.json)" ]]; then
            git config user.name "bench-market-bot"
            git config user.email "bench-market-bot@users.noreply.github.com"
            git add registry.json rules.json
            git commit -m "chore: rebuild indexes [skip ci]"
            git push origin HEAD:main
          else
            echo "indexes up to date"
          fi
